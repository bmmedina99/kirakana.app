name: Pull Request Checks

run-name: "Validate PR #${{ github.event.pull_request.number }} - ${{ github.event.pull_request.title }}"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

env:
  NODE_VERSION: 26

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm ci

      - name: Run Biome checks
        run: pnpm run lint

      - name: Run TypeScript diagnostics
        run: pnpm run check

  test:
    name: Unit tests
    needs: quality
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm ci

      - name: Run tests with coverage
        run: pnpm run test:coverage

      - name: Upload coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-pr-${{ github.event.pull_request.number }}
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Production build
    needs: [quality, test]
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm ci

      - name: Build static site
        run: pnpm exec astro build

      - name: Upload production build
        uses: actions/upload-artifact@v7
        with:
          name: production-build-pr-${{ github.event.pull_request.number }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
